<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basbousa’s Recipe Booklet</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Twemoji Country Flags";unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E0063,U+E0065,U+E0067,U+E006C,U+E006E,U+E0073-E0074,U+E0077,U+E007F;src:url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1/dist/TwemojiCountryFlags.woff2") format("woff2")}
.tile{position:relative}.tile .fl{position:absolute;top:6px;right:8px;font-size:1.3rem;font-style:normal}.row .fl{font-size:1.2rem}.fl,.chip,.row,.tile small{font-family:"Twemoji Country Flags",Nunito,system-ui,sans-serif}
:root{--pink:#ff7eb6;--pink2:#ffd6e8;--pur:#a78bfa;--pur2:#e6dcff;--yel:#ffd666;--yel2:#fff1bd;--ink:#4a2f5a;--mute:#7d6890;--paper:#fffaf5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;font:16px/1.5 "Twemoji Country Flags",Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#ffe3f1,#e9defe 55%,#fff0bf)}
#book{width:100%;max-width:580px;height:min(94vh,840px);position:relative;border-radius:22px;background:linear-gradient(160deg,var(--pink),var(--pur));padding:10px 10px 10px 24px;box-shadow:0 14px 40px rgba(120,60,150,.3)}
#book:before{content:"";position:absolute;left:7px;top:22px;bottom:22px;width:10px;background:radial-gradient(circle,#fff 38%,transparent 42%) 0 0/10px 28px repeat-y}
#stage{position:relative;height:100%;perspective:1800px}
.page{position:absolute;inset:0;overflow-y:auto;border-radius:12px;padding:20px 18px 28px;background:var(--paper);z-index:1;--a:var(--pur);--b:var(--pur2)}
.c1{--a:#a78bfa;--b:#e6dcff}.c2{--a:#ffd666;--b:#fff1bd}.c3{--a:#ff7eb6;--b:#ffd6e8}
.out{z-index:3;transform-origin:left center;animation:fo .85s ease-in forwards;box-shadow:14px 0 26px rgba(80,40,100,.3)}
.outb{z-index:3;transform-origin:right center;animation:fb .85s ease-in forwards;box-shadow:-14px 0 26px rgba(80,40,100,.3)}
@keyframes fo{to{transform:rotateY(-115deg);opacity:0}}
@keyframes fb{to{transform:rotateY(115deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.out,.outb{animation-duration:.01s}}
h1,h2{font-family:Pacifico,cursive;font-weight:400;margin:.2em 0;text-align:center;color:var(--ink)}
h1{font-size:2.3rem;line-height:1.2;background:linear-gradient(90deg,#ff5fa2,#8f6cf5);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.7rem}
h3{margin:18px 0 8px;font-weight:800}
.sub,.tagl{text-align:center;color:var(--mute);margin:.3em 0 1em}
.cov{text-align:center;padding-top:6px}
.av{width:min(300px,72%);aspect-ratio:1;object-fit:cover;border-radius:50%;border:6px solid var(--yel);box-shadow:0 8px 20px rgba(167,139,250,.5);margin:10px auto;display:block}
.btn{display:inline-block;min-height:46px;padding:10px 22px;border:0;border-radius:999px;font:800 1rem Nunito,sans-serif;color:#fff;background:linear-gradient(135deg,#ff6fae,#9a73f7);cursor:pointer;box-shadow:0 4px 10px rgba(150,80,180,.3);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--pur2);color:var(--ink);box-shadow:none}
.btn.sun{background:var(--yel);color:var(--ink)}
.skip{display:block;margin:26px auto 0}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mb{min-height:92px;border:0;border-radius:20px;font:800 1.05rem Nunito,sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.mb:hover{transform:scale(1.04) rotate(-1deg)}
.mb span{font-size:2rem}
.mb:nth-child(1){background:var(--yel)}.mb:nth-child(2){background:#cdbdfc}.mb:nth-child(3){background:#ffb3d4}.mb:nth-child(4){background:#ffc4e1}.mb:nth-child(5){background:#ffe49a}.mb:nth-child(6){background:#d9cdfd}
.tc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin:12px 0;padding:16px;border:0;border-radius:22px;background:var(--b);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 5px 12px rgba(120,60,150,.15);transition:transform .15s}
.tc:hover{transform:translateX(5px)}
.tc .ic{flex:none;width:62px;height:62px;border-radius:50%;background:var(--a);display:grid;place-items:center;font-size:2rem}
.tc b{display:block;font-size:1.15rem}.tc small{color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.tile{border:0;border-radius:18px;background:var(--b);padding:14px 8px;text-align:center;color:var(--ink);font:700 .95rem Nunito,sans-serif;cursor:pointer;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(1deg)}
.tile i{display:block;font-style:normal;font-size:2.3rem}.tile small{display:block;color:var(--mute);font-weight:400}
.row{display:flex;gap:12px;align-items:center;width:100%;margin:8px 0;padding:10px 12px;border:0;border-radius:16px;background:var(--pur2);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.row i{font-style:normal;font-size:1.9rem}.row small{display:block;color:var(--mute)}
.hero{width:130px;height:130px;margin:6px auto;border-radius:50%;background:radial-gradient(circle,#fff,var(--b));border:5px solid var(--a);display:grid;place-items:center;font-size:4rem;position:relative;box-shadow:0 6px 14px rgba(120,60,150,.2)}
.hero:before,.hero:after{content:"✨";position:absolute;font-size:1.4rem}.hero:before{left:-14px;top:4px}.hero:after{right:-12px;bottom:8px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--b);border-radius:999px;padding:4px 14px;font-weight:700}
.ph{width:100%;border-radius:16px;margin:8px 0}
.ing{display:flex;gap:10px;padding:7px 10px;margin:5px 0;background:var(--b);border-radius:12px;cursor:pointer}
.ing input{width:20px;height:20px;accent-color:#ff5fa2;flex:none;margin-top:2px}
.ing input:checked+span{text-decoration:line-through;opacity:.55}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
ol.steps li{counter-increment:s;display:flex;gap:12px;margin:10px 0;align-items:flex-start}
ol.steps li:before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--a);color:var(--ink);font-weight:800;display:grid;place-items:center}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
#mbtn{position:fixed;right:12px;bottom:12px;z-index:9;min-height:44px;padding:8px 16px;border:0;border-radius:999px;background:var(--yel);color:var(--ink);font:800 .9rem Nunito,sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.page{background-image:radial-gradient(var(--b) 1.5px,transparent 2px);background-size:24px 24px}
#nav{display:none;position:absolute;left:24px;right:10px;bottom:8px;height:44px;gap:5px}
.hasnav #nav{display:flex}
.hasnav #stage{height:calc(100% - 54px)}
.nb{flex:1;min-width:0;border:0;border-radius:14px;background:var(--pur2);color:var(--ink);font:800 .72rem Nunito,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.nb span{font-size:1.15rem}.nb:hover{background:var(--yel)}
.flg{height:1.1em;width:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.18);vertical-align:-.18em}
.flg.big{height:32px}
.tile .flg{position:absolute;top:8px;right:8px;height:18px}
.row .flg{height:16px;margin-left:4px}
.ban{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px;margin:0 0 12px;border-radius:16px;background:var(--b);border:2px dashed var(--a)}
.bd{font-size:1.5rem;letter-spacing:.2em}.bt{font-weight:800}
.rib{text-align:center;letter-spacing:.3em;margin:-2px 0 10px;font-size:.95rem}
.ctr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cb{border:0;border-radius:14px;background:var(--pur2);padding:8px 4px;font:700 .8rem Nunito,sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.cb small{font-weight:400;color:var(--mute)}.cb:hover{background:var(--yel)}
.si,.ie{margin-right:3px}
#q{margin:14px 0 6px}
.bx{background:var(--b,var(--pur2));border-radius:14px;padding:10px 14px;margin:10px 0}
.page{--b:var(--pur2)}
</style>
</head>

function mood(){return '<h2>How are you feeling today?</h2><div class="rib">✿ ✨ ✿ 💖 ✿ ✨ ✿</div><p class="sub">Pick your mood and I’ll suggest recipes for you.</p><div class="moods">'+MOODS.map(function(m){return '<button class="mb" data-a="pick:'+m[0]+'"><span>'+m[1]+'</span>'+m[2]+'</button>'}).join("")+'</div><button class="btn ghost skip" data-a="toc">Skip to the table of contents ➜</button>'}
function pick(x){var m=MOODS.filter(function(a){return a[0]==x})[0],L=ALL.filter(function(p){return REC[p[0]][p[1]][5].indexOf(x)>-1});L.sort(function(){return Math.random()-.5});
return '<h2>'+m[1]+' '+m[2]+' mood</h2><p class="sub">'+m[3]+'</p>'+L.slice(0,5).map(function(p){return row(p[0],p[1])}).join("")+'<div class="nav"><button class="btn ghost" data-a="mood" data-b="1">◀ Change mood</button><button class="btn" data-a="toc">Table of contents ➜</button></div>'}
function toc(){var cc={};ALL.forEach(function(p){var c=CU[REC[p[0]][p[1]][0]];cc[c]=(cc[c]||0)+1});
return '<h2>Table of Contents</h2><div class="rib">✿ ☕ ✿ 🍽️ ✿ 🍰 ✿</div>'+Object.keys(SEC).map(function(k){var s=SEC[k];return '<button class="tc '+s.c+'" data-a="sec:'+k+'"><span class="ic">'+s.e+'</span><span><b>'+s.t+'</b><small>'+s.d+' · '+REC[k].length+' recipes</small></span></button>'}).join("")+'<input id="q" class="in" placeholder="🔎 Search a recipe or a country…" autocomplete="off"><div id="qr"></div><h3>🌍 Browse by country</h3><div class="ctr">'+Object.keys(cc).sort(function(a,b){return CT[a][0]<CT[b][0]?-1:1}).map(function(c){return '<button class="cb" data-a="ctry:'+c+'">'+flg(c,1)+CT[c][0]+'<small>'+cc[c]+' recipes</small></button>'}).join("")+'</div><button class="tc c1" style="margin-top:16px" data-a="basics"><span class="ic">💡</span><span><b>Kitchen Basics</b><small>Heat levels, measuring, rice, oven tips…</small></span></button>'}
function sec(k){var s=SEC[k];return '<h2>'+s.e+' '+s.t+'</h2><div class="ban"><span class="bd">'+s.g+'</span></div><div class="grid">'+REC[k].map(function(r,i){return '<button class="tile" data-a="rec:'+k+':'+i+'">'+flg(CU[r[0]])+'<i>'+r[1]+'</i>'+r[0]+'<small>⏱️ '+r[2]+'</small></button>'}).join("")+'</div><div class="nav"><button class="btn ghost" data-a="toc" data-b="1">◀ Contents</button></div>'}
function ctry(c){return '<h2>'+CT[c][0]+'</h2>'+ban(c)+ALL.filter(function(p){return CU[REC[p[0]][p[1]][0]]==c}).map(function(p){return row(p[0],p[1])}).join("")+'<div class="nav"><button class="btn ghost" data-a="toc" data-b="1">◀ Contents</button></div>'}
function basics(){return '<h2>💡 Kitchen Basics</h2><div class="rib">✿ 🔥 ✿ 🥄 ✿ 🍚 ✿</div><div class="bx"><b>🔥 Heat on the stove</b><br><b>Low:</b> a tiny flame. Food stays warm and bubbles very slowly.<br><b>Medium:</b> half flame. Gentle, steady bubbles or sizzle.<br><b>High:</b> full flame. Big bubbles. Use it only for boiling water and quick stir-frying.<br><b>Simmer</b> = tiny bubbles on low/medium heat. <b>Boil</b> = big bubbles all over.</div><div class="bx"><b>🥄 Measuring</b><br>1 cup = 240 ml (use a measuring cup, because tea glasses differ). 1 tbsp = 15 ml. 1 tsp = 5 ml. A level spoon means scraping the top flat.</div><div class="bx"><b>🍚 Rice</b><br>Put the rice in a bowl, cover with cold water, rub gently and pour the cloudy water away. Repeat 3 times until it is almost clear. If the recipe says soak, leave it in cold water 20–30 minutes. Drain it in a fine sieve (a sieve has tiny holes, a colander has big holes).</div><div class="bx"><b>🍝 Pasta and draining</b><br>Boil in plenty of salted water. Drain in a colander in the sink, and keep your face away from the steam.</div><div class="bx"><b>♨️ Oven</b><br>Switch it on 10–15 minutes early (preheat). 160°C = low, 180°C = medium, 200°C = hot. Use the middle rack. Every oven is different, so check the food 5 minutes before the time ends.</div><div class="bx"><b>🍗 Chicken and eggs</b><br>Chicken must be white inside with clear juices and no pink. Eggs must be cooked until firm.</div><div class="bx"><b>📖 Words</b><br><b>Dice</b> = small cubes. <b>Mince</b> = chop very fine. <b>Grate</b> = rub on the grater. <b>Whisk</b> = beat quickly. <b>Fold</b> = mix gently from bottom to top. <b>Sauté</b> = fry quickly in a little oil. <b>Rest</b> = leave without touching.</div><div class="bx"><b>🧤 Safety</b><br>Use oven gloves, turn pot handles inward, and never leave hot oil alone.</div>'}
function rec(k,i){var r=REC[k][i],c=CU[r[0]],n=REC[k].length;return ban(c)+'<div class="hero">'+r[1]+'</div><h2>'+r[0]+'</h2><div class="chips"><span class="chip">⏱️ '+r[2]+'</span><span class="chip">🍽️ Serves '+r[3]+'</span><span class="chip">⭐ '+r[4]+'</span><span class="chip">'+flg(c)+' '+CT[c][1]+'</span></div><h3>🛒 Ingredients</h3>'+r[6].map(function(x){return '<label class="ing"><input type="checkbox"><span><span class="ie">'+ie(x)+'</span> '+x+'</span></label>'}).join("")+'<h3>👩‍🍳 Steps</h3><ol class="steps">'+r[7].map(function(x){return '<li><span><span class="si">'+si(x)+'</span>'+x+'</span></li>'}).join("")+'</ol><div class="rib">✿ ✨ ✿ 💖 ✿ ✨ ✿</div><div class="nav">'+(i>0?'<button class="btn ghost" data-a="rec:'+k+':'+(i-1)+'" data-b="1">◀ Previous</button>':'<span></span>')+'<button class="btn sun" data-a="sec:'+k+'" data-b="1">📖 All recipes</button>'+(i<n-1?'<button class="btn" data-a="rec:'+k+':'+(i+1)+'">Next ▶</button>':'<span></span>')+'</div>'}
function show(h,back,cls,nv){var n=document.createElement("div");n.className="page "+(cls||"");n.innerHTML=h;st.appendChild(n);$("book").classList.toggle("hasnav",nv!==0);if(cur){flip();var o=cur;o.classList.add(back?"outb":"out");setTimeout(function(){o.remove()},900)}cur=n}

else if(x=="ctry")show(ctry(a[1]),bk)
else if(x=="basics")show(basics(),bk)}
